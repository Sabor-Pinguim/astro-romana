<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room Server Test</title>
<style>
  :root { --bg: #f6f5fb; --panel: #fff; --ink: #1d1a2b; --muted: #6b6680; --line: #dcd8ea; --accent: #6a4fd8; --ok: #1f8a62; --bad: #c0392b; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14121d; --panel: #1e1b2b; --ink: #ece9f7; --muted: #a39cc0; --line: #34304a; --accent: #a993ff; --ok: #5fd3a5; --bad: #ff8a7a; } }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, sans-serif; }
  main { max-width: 980px; margin: 0 auto; display: grid; gap: 12px; }
  h1 { font-size: 18px; margin: 0; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  input, select, textarea, button { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  input, textarea { min-width: 0; }
  textarea { width: 100%; min-height: 70px; font-family: ui-monospace, monospace; font-size: 12px; }
  button { cursor: pointer; background: var(--accent); color: #fff; border-color: transparent; }
  button.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
  button:disabled { opacity: .45; cursor: default; }
  .code { font: 700 28px ui-monospace, monospace; letter-spacing: .15em; }
  .muted { color: var(--muted); }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
  table { width: 100%; border-collapse: collapse; }
  td, th { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); }
  #log { max-height: 320px; overflow: auto; font: 12px ui-monospace, monospace; margin: 0; padding: 0; list-style: none; }
  #log li { padding: 3px 0; border-bottom: 1px solid var(--line); word-break: break-all; }
  #link { flex: 1 1 220px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="row"><h1>Astro Romana · room server test</h1><span id="status" class="muted">idle</span></div>

  <section>
    <h2>Server</h2>
    <div class="row"><input id="server" size="40" aria-label="Server URL"><span class="muted">?server=ws://host:port/ws to change</span></div>
  </section>

  <section id="lobby">
    <div class="grid">
      <div>
        <h2>Host</h2>
        <div class="row"><input id="create-seat" placeholder="seat (default: first)" size="18"><button id="create">Create room</button></div>
      </div>
      <div>
        <h2>Guest</h2>
        <div class="row"><input id="join-code" placeholder="CODE" size="6" maxlength="8"><input id="join-seat" placeholder="seat (default: free)" size="16"><button id="join">Join</button></div>
      </div>
    </div>
  </section>

  <section id="room" hidden>
    <div class="row"><span class="code" id="code"></span><span id="role" class="muted"></span><span style="flex:1"></span><button class="ghost" id="leave">Leave</button></div>
    <div class="row" style="margin-top:8px"><input id="link" readonly aria-label="Invite link"><button id="copy">Copy link</button></div>
    <div class="grid" style="margin-top:12px">
      <div>
        <h2>Seats</h2>
        <table><thead><tr><th>Seat</th><th>Peer</th><th></th></tr></thead><tbody id="seats"></tbody></table>
      </div>
      <div>
        <h2>Phase</h2>
        <div class="row"><strong id="phase"></strong><span class="muted" id="joinable"></span></div>
        <div class="row" id="phase-host" style="margin-top:6px"><input id="phase-input" placeholder="cockpit" size="14"><button id="phase-set">Set phase</button></div>
      </div>
    </div>
  </section>

  <section id="channels" hidden>
    <h2>Send</h2>
    <div class="row">
      <select id="channel" aria-label="Channel">
        <option value="state">state (host → guests, cached)</option>
        <option value="event">event (host → guests)</option>
        <option value="act">act (guest → host)</option>
        <option value="pose">pose (→ others, cached)</option>
        <option value="send">send (free relay)</option>
        <option value="meta">meta (your peer info)</option>
      </select>
      <input id="key" placeholder="state key" size="12">
      <input id="to" placeholder="to: all | others | host | id" size="22" hidden>
      <button id="send">Send</button>
    </div>
    <textarea id="data" aria-label="JSON data">{"hello": "mars"}</textarea>
  </section>

  <section>
    <h2>Log</h2>
    <ul id="log"></ul>
  </section>
</main>

<script src="../client/room-client.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const defaultServer = params.get('server')
    || (location.protocol.startsWith('http') ? `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws` : 'ws://localhost:8787/ws');
  $('server').value = defaultServer;
  $('join-code').value = RoomClient.codeFromUrl() || '';

  let room = null;
  function log(text, cls) {
    const li = document.createElement('li');
    li.textContent = `${new Date().toLocaleTimeString()}  ${text}`;
    if (cls) li.className = cls;
    $('log').prepend(li);
    while ($('log').children.length > 200) $('log').lastElementChild.remove();
  }
  const show = v => JSON.stringify(v);

  function client() {
    if (room && room.url === $('server').value) return room;
    if (room) room.close();
    room = new RoomClient({ url: $('server').value.trim() });
    room.on('status', s => { $('status').textContent = s; $('status').className = s === 'open' ? 'ok' : s === 'closed' ? 'bad' : 'muted'; });
    room.on('welcome', m => { log(`${m.t} ${m.code} as ${m.you.seat} (${m.you.id}) · state ${show(m.state)} · poses ${m.poses.length}`, 'ok'); render(); });
    room.on('peers', render);
    room.on('phase', p => { log(`phase → ${p}`); render(); });
    room.on('state', (k, d) => log(`state ${k} = ${show(d)}`));
    room.on('event', d => log(`event ${show(d)}`));
    room.on('act', (d, f) => log(`act from ${f.seat}: ${show(d)}`));
    room.on('pose', (d, f) => log(`pose from ${f.seat}: ${show(d)}`));
    room.on('msg', (d, f) => log(`msg from ${f.seat}: ${show(d)}`));
    room.on('error', e => log(`error ${e.code}${e.ref ? ` (${e.ref})` : ''}`, 'bad'));
    room.on('closed', r => { log(`room closed: ${r}`, 'bad'); render(); });
    return room;
  }

  function render() {
    const inRoom = !!room?.inRoom;
    $('room').hidden = $('channels').hidden = !inRoom;
    $('lobby').hidden = inRoom;
    if (!inRoom) return;
    $('code').textContent = room.code;
    $('role').textContent = room.isHost ? 'host' : 'guest';
    $('link').value = RoomClient.linkFor(room.code);
    $('phase').textContent = room.phase;
    $('joinable').textContent = room.joinable.includes(room.phase) ? 'open to join' : 'in progress (resume only)';
    $('phase-host').hidden = !room.isHost;
    $('seats').innerHTML = '';
    for (const seat of room.seats) {
      const peer = room.peers.find(p => p.seat === seat);
      const tr = document.createElement('tr');
      const who = peer ? `${peer.id}${peer.id === room.you.id ? ' (you)' : ''}${peer.host ? ' · host' : ''}${peer.online ? '' : ' · offline'}${peer.meta ? ' · ' + show(peer.meta) : ''}` : 'AI (free)';
      tr.innerHTML = '<td></td><td></td><td></td>';
      tr.cells[0].textContent = seat;
      tr.cells[1].textContent = who;
      if (!peer && !room.isHost && room.joinable.includes(room.phase)) {
        const b = document.createElement('button');
        b.className = 'ghost'; b.textContent = 'Take';
        b.onclick = () => room.setSeat(seat);
        tr.cells[2].append(b);
      }
      $('seats').append(tr);
    }
  }

  async function enter(fn) {
    try { await fn(client()); } catch (err) { log(`failed: ${err.code || err.message}`, 'bad'); }
    render();
  }
  $('create').onclick = () => enter(r => r.create({ seat: $('create-seat').value.trim() || undefined }));
  $('join').onclick = () => enter(r => r.join($('join-code').value, { seat: $('join-seat').value.trim() || undefined }));
  $('leave').onclick = () => { room.leave(); render(); };
  $('copy').onclick = async () => {
    try { await navigator.clipboard.writeText($('link').value); log('link copied'); }
    catch { $('link').select(); log('select the link and copy it'); }
  };
  $('phase-set').onclick = () => { room.setPhase($('phase-input').value.trim()); render(); };
  $('channel').onchange = () => { $('key').hidden = $('channel').value !== 'state'; $('to').hidden = $('channel').value !== 'send'; };
  $('send').onclick = () => {
    let data;
    try { data = JSON.parse($('data').value); } catch { log('data is not valid JSON', 'bad'); return; }
    const ch = $('channel').value;
    const sent = ch === 'state' ? room.setState($('key').value.trim() || 'demo', data)
      : ch === 'event' ? room.emit(data)
      : ch === 'act' ? room.act(data)
      : ch === 'pose' ? room.pose(data)
      : ch === 'meta' ? room.setMeta(data)
      : room.send(data, $('to').value.trim() || 'all');
    log(`${sent ? 'sent' : 'not sent (offline)'} ${ch} ${show(data)}`, sent ? '' : 'bad');
  };

  // Back to the same seat after a reload, or straight into the room of an invite link.
  (async () => {
    const r = client();
    if (await r.rejoin().catch(() => null)) return render();
    if (RoomClient.codeFromUrl()) enter(c => c.join(RoomClient.codeFromUrl()));
  })();
</script>
</body>
</html>
